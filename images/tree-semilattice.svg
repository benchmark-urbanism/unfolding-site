    <path d="M900 375L860 470"/>
    <path d="M900 375L940 470"/>
    <path d="M990 375L940 470"/>
    <path d="M990 375L1020 470"/>
  </g>
  <g fill="#1c1a17">
    <circle cx="300" cy="110" r="8"/>
    <circle cx="420" cy="200" r="8"/>
    <circle cx="340" cy="300" r="8"/>
    <circle cx="140" cy="330" r="8"/>
