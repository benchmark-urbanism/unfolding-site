    <path d="M340 300L420 470"/>
    <path d="M140 330L100 470"/>
    <path d="M140 330L180 470"/>
    <path d="M900 90L830 165"/>
    <path d="M900 90L1030 200"/>
    <path d="M830 165L750 285"/>
    <path d="M830 165L850 275"/>
    <path d="M830 165L960 285"/>
    <path d="M1030 200L960 285"/>
