  <g font-size="22" fill="#1c1a17" text-anchor="middle">
    <text x="284" y="117" text-anchor="end">123456</text>
    <text x="436" y="207" text-anchor="start">3456</text>
    <text x="356" y="307" text-anchor="start">345</text>
    <text x="124" y="337" text-anchor="end">12</text>
