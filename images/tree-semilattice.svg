<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Cormorant Garamond', Garamond, 'Times New Roman', serif">
  <!-- The tree and the semilattice, redrawn after Christopher Alexander, A City Is Not a Tree, 1965 (his diagrams D and B).
       Six elements along the foot. Each set is a dot, placed higher the larger it is, with a line to each set just inside it.
       The tree: 12, 345, 3456, and the whole, none overlapping. The semilattice: 123, 34, 45, 234, 345, 12345, 3456, and the
       whole, which overlap, so that 34 belongs to both 234 and 345. -->
